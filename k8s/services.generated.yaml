  strategy: {type: Recreate}   # a 2-vCPU Box cannot start a second copy of 22 services next to the first
  selector:
    matchLabels: {app: ach-gateway}
  template:
    metadata:
      labels: {app: ach-gateway, fakeco/kind: backoffice}
    spec:
      containers:
        - name: service
          image: fakeco-services:dev
          imagePullPolicy: IfNotPresent
          args: ["fakeco.run", "ach-gateway"]
          envFrom:
            - configMapRef: {name: fakeco}
          env:
            - name: K8S_POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: K8S_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - {name: OTEL_RESOURCE_ATTRIBUTES, value: "k8s.namespace.name=$(K8S_NAMESPACE),k8s.deployment.name=ach-gateway,k8s.pod.name=$(K8S_POD_NAME)"}
          ports: [{containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 5
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 300Mi}
