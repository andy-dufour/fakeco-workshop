# The Python services' tests, and the web app's type check and build.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15" # same as services/Dockerfile
          cache: pip
          cache-dependency-path: services/requirements.txt
      - run: pip install -r services/requirements.txt pytest
      - run: python -m pytest tests -q
        working-directory: services
        env:
          FAKECO_LOCAL: "1"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22" # same as web/Dockerfile
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
